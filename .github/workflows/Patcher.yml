name: Patch console-detect Binary

on:
  workflow_dispatch:
  push:
    paths:
      - '**console_detect**'

permissions:
  contents: write

jobs:
  patch-binary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate and Patch String in console-detect
        run: |
          python3 - << 'EOF'
          import os, sys

          target_filename = "console_detect"
          found_path = None

          # Search entire repo for the file
          for root, dirs, files in os.walk("."):
              if target_filename in files:
                  found_path = os.path.join(root, target_filename)
                  break

          if not found_path:
              print(f"[!] ERROR: '{target_filename}' was not found anywhere in the repo!")
              print("Files currently in repo root:", os.listdir("."))
              sys.exit(1)

          print(f"[+] Found binary at: {found_path}")

          OLD_BYTES = b"rk3326-r36tmax-linux.dtb"        # 24 bytes
          NEW_BYTES = b"rk3326-m9pro-linux.dtb\x00\x00"  # 22 bytes + 2 nulls = 24 bytes

          with open(found_path, "rb") as f:
              data = f.read()

          if OLD_BYTES not in data:
              print(f"[!] Target string 'rk3326-r36tmax-linux.dtb' not found inside {found_path}.")
              sys.exit(1)

          count = data.count(OLD_BYTES)
          patched_data = data.replace(OLD_BYTES, NEW_BYTES)

          with open(found_path, "wb") as f:
              f.write(patched_data)

          print(f"[+] Successfully replaced {count} occurrence(s) in {found_path}.")
          EOF

      - name: Upload Patched Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: console-detect-m9pro
          path: "**/console_detect"
          retention-days: 14

      - name: Commit and Push Patched Binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "fix(binary): patch console-detect string to support m9pro dtb"
          git push origin main || git push origin master
