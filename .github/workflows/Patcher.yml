name: Patch console-detect Binary

on:
  workflow_dispatch:
  push:
    paths:
      - 'console-detect'

permissions:
  contents: write

jobs:
  patch-binary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Patch String in console-detect Binary
        run: |
          python3 - << 'EOF'
          import os

          input_file = "console-detect"
          output_file = "console-detect"

          # Length check: Both sequences must equal 24 bytes exactly
          OLD_BYTES = b"rk3326-r36tmax-linux.dtb"        # 24 bytes
          NEW_BYTES = b"rk3326-m9pro-linux.dtb\x00\x00"  # 22 bytes + 2 null bytes = 24 bytes

          if not os.path.exists(input_file):
              print(f"[!] ERROR: {input_file} not found in repo root!")
              exit(1)

          with open(input_file, "rb") as f:
              data = f.read()

          if OLD_BYTES not in data:
              print("[!] Target string 'rk3326-r36tmax-linux.dtb' not found inside binary.")
              exit(1)

          count = data.count(OLD_BYTES)
          patched_data = data.replace(OLD_BYTES, NEW_BYTES)

          with open(output_file, "wb") as f:
              f.write(patched_data)

          print(f"[+] Successfully replaced {count} occurrence(s) of string in binary.")
          EOF

      - name: Ensure Executable Permissions
        run: chmod +x console-detect

      - name: Upload Patched Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: console-detect-m9pro
          path: console-detect
          retention-days: 14

      - name: Commit and Push Patched Binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add console-detect
          git diff --quiet && git diff --staged --quiet || git commit -m "fix(binary): patch console-detect string to support m9pro dtb"
          git push origin main || git push origin master
